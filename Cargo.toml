[package]
name = "herdr-notes"
version = "1.0.0"
edition = "2024"
description = "Persistent markdown notes pane for herdr"
license = "MIT"

[[bin]]
name = "herdr-notes"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"
anyhow = "1"
sha2 = "0.10"
tempfile = "3"
toml = "0.9"

[target.'cfg(windows)'.dependencies]
base64 = "0.22"
