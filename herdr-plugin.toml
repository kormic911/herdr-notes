id = "herdr-notes"
name = "herdr-notes"
version = "1.0.0"
description = "Persistent Markdown notes for each Herdr tab."
min_herdr_version = "0.9.5"
platforms = ["linux", "macos", "windows"]

[[build]]
platforms = ["windows"]
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "scripts/install.ps1"]

[[build]]
platforms = ["linux", "macos"]
command = ["bash", "scripts/install.sh"]

[[startup]]
command = ["./target/release/herdr-notes", "--restore"]

[[actions]]
id = "install-keybindings"
title = "Install Notes key bindings"
description = "Add the Notes shortcut and reload Herdr configuration."
contexts = ["global", "workspace", "pane"]
command = ["./target/release/herdr-notes", "--install-keybindings"]

[[actions]]
id = "open-notes"
title = "Open Notes in this shell"
contexts = ["pane"]
command = ["./target/release/herdr-notes", "--open"]

# Keep existing Windows bindings working after the upgrade.
[[actions]]
id = "open-notes-windows"
title = "Open Notes in this shell (legacy Windows binding)"
platforms = ["windows"]
contexts = ["pane"]
command = ["./target/release/herdr-notes", "--open"]
